apiVersion: apps/v1
kind: Deployment
metadata:
  name: footnote-serve
  labels:
    app.kubernetes.io/name: footnote
    app.kubernetes.io/component: serve
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: footnote
      app.kubernetes.io/component: serve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: footnote
        app.kubernetes.io/component: serve
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serve
          image: ghcr.io/thnhdatle/footnote:v0.1.0
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: footnote-config
            - secretRef:
                name: footnote-secrets
          ports:
            - name: http
              containerPort: 8000
            - name: admin
              containerPort: 9094
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: footnote-models
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: footnote
  labels:
    app.kubernetes.io/name: footnote
spec:
  selector:
    app.kubernetes.io/name: footnote
    app.kubernetes.io/component: serve
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: admin
      port: 9094
      targetPort: admin
