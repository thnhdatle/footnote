apiVersion: batch/v1
kind: Job
metadata:
  name: footnote-migrate
  labels:
    app.kubernetes.io/name: footnote
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/thnhdatle/footnote:v0.1.0
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: footnote-config
            - secretRef:
                name: footnote-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
