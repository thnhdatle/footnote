name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FOOTNOTE_NIGHTLY: "1"
  RAYLD_FAKELLM_IMAGE: ghcr.io/thnhdatle/fakellm:v0.1.0

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: scripts/ci_install_tools.sh
      - name: Cache pinned models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rayld/footnote/models
          key: models-${{ hashFiles('models/manifest.yaml') }}
      - run: make bootstrap
      - name: Pull the fakellm image
        run: docker pull "$RAYLD_FAKELLM_IMAGE"
      - run: make fuzz
