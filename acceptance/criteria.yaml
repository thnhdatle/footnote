project: footnote
machine: "MacBook Pro M3 Pro 36 GB, Docker VM 8 CPU / 10 GB"
# Each criterion has thresholds for the reference machine (pass.mac) and for CI runners
# (pass.ci, selected with CI=1; "skip" means the criterion does not run in CI). Tests read
# them at run time. kind: functional (correctness), quality (retrieval and answer quality on
# public datasets), performance (latency, calibrated for the reference machine) or release
# (quickstart from a clean checkout). `requires` lists the capabilities the runner probes
# before running a criterion; see acceptance/README.md.
criteria:
  - id: FNT-01
    title: "Retrieval quality on BEIR SciFact test with shipped defaults"
    test: test_acc_fnt01_retrieval_quality
    kind: quality
    real_deps: [postgres]
    requires: [nightly, network]
    pass:
      mac: { vector_ndcg10_min: 0.69, lexical_ndcg10_min: 0.38, hybrid_rerank_ndcg10_min: 0.65, hybrid_rerank_recall10_min: 0.75, queries: 300 }
      ci: { vector_ndcg10_min: 0.69, lexical_ndcg10_min: 0.38, hybrid_rerank_ndcg10_min: 0.65, hybrid_rerank_recall10_min: 0.75, queries: 300 }
  - id: FNT-02
    title: "Answer faithfulness and citation precision on 100 SciFact queries (LM Studio, same model generates and judges)"
    test: test_acc_fnt02_faithfulness
    kind: quality
    real_deps: [postgres, lmstudio]
    requires: [lmstudio, network]
    pass:
      mac: { faithfulness_min: 0.70, citation_precision_min: 0.70, items: 100 }
      ci: skip
  - id: FNT-03
    title: "Ablation report generated by one command and committed"
    test: test_acc_fnt03_ablation_report
    kind: quality
    real_deps: [postgres]
    requires: [nightly, network]
    pass:
      mac: { rows_required: "all", metrics: [recall_at_10, ndcg_at_10, p95_ms] }
      ci: { rows_required: "all", metrics: [recall_at_10, ndcg_at_10, p95_ms] }
  - id: FNT-04
    title: "Citation validity over at least 1,000 scripted answers"
    test: test_acc_fnt04_citations_valid
    kind: functional
    real_deps: [postgres, fakellm]
    requires: ["sibling:fakellm", docker]
    pass:
      mac: { answers_min: 1000, invalid_citations: 0, invalid_markers_left: 0, unflagged_unsupported: 0, dropped: 0 }
      ci: { answers_min: 1000, invalid_citations: 0, invalid_markers_left: 0, unflagged_unsupported: 0, dropped: 0 }
  - id: FNT-05
    title: "Cross-tenant isolation under 10,000 calls plus RLS-only run"
    test: test_acc_fnt05_tenant_isolation
    kind: functional
    real_deps: [postgres]
    requires: [docker]
    pass:
      mac: { calls: 10000, fault_calls: 1000, leaks: 0, role_assertions_failed: 0 }
      ci: { calls: 10000, fault_calls: 1000, leaks: 0, role_assertions_failed: 0 }
  - id: FNT-06
    title: "Incremental indexing embeds exactly the changed chunks"
    test: test_acc_fnt06_incremental
    kind: functional
    real_deps: [postgres, fakellm]
    requires: ["sibling:fakellm", docker]
    pass:
      mac: { documents: 1000, embedded_minus_changed: 0, identical_reupload_embeddings: 0, rows_left_after_delete: 0, dropped: 0 }
      ci: { documents: 1000, embedded_minus_changed: 0, identical_reupload_embeddings: 0, rows_left_after_delete: 0, dropped: 0 }
  - id: FNT-07
    title: "Hybrid + rerank retrieval latency on 100k TREC-COVID chunks"
    test: test_acc_fnt07_latency
    kind: performance
    real_deps: [postgres]
    requires: [nightly, network, mac]
    pass:
      mac: { p95_ms_max: 600, chunks: 100000, queries: 1000, runs: 3 }
      ci: { p95_ms_max: 1800, chunks: 100000, queries: 1000, runs: 3 }
  - id: FNT-08
    title: "Abstention gate on SciFact answerable vs unanswerable claims"
    test: test_acc_fnt08_abstention
    kind: quality
    real_deps: [postgres]
    requires: [nightly, network]
    pass:
      mac: { auc_min: 0.62, answer_rate_min: 0.75, abstain_rate_min: 0.25, calibration_drift_max: 0.01, per_group: 100 }
      ci: { auc_min: 0.62, answer_rate_min: 0.75, abstain_rate_min: 0.25, calibration_drift_max: 0.01, per_group: 100 }
  - id: FNT-09
    title: "Parser fidelity on generated fixtures"
    test: test_acc_fnt09_parser_fidelity
    kind: functional
    real_deps: []
    requires: []
    pass:
      mac: { heading_match: 1.0, table_match: 1.0, paragraph_order_match: 1.0, pdf_page_match: 1.0 }
      ci: { heading_match: 1.0, table_match: 1.0, paragraph_order_match: 1.0, pdf_page_match: 1.0 }
  - id: FNT-10
    title: "Consistency during version swaps and a space change"
    test: test_acc_fnt10_swap_consistency
    kind: functional
    real_deps: [postgres, fakellm]
    requires: ["sibling:fakellm", docker]
    pass:
      mac: { queries: 5000, swaps: 50, mixed_version_results: 0, failed_queries: 0, space_changes_observed_per_client: 1, old_space_vectors_left: 0 }
      ci: { queries: 5000, swaps: 50, mixed_version_results: 0, failed_queries: 0, space_changes_observed_per_client: 1, old_space_vectors_left: 0 }
  - id: FNT-11
    title: "Offline quickstart completes in under 5 minutes with a valid citation"
    test: test_acc_fnt11_quickstart
    kind: release
    real_deps: [docker, fakellm]
    requires: [docker, "sibling:fakellm"]
    pass:
      mac: { seconds_max: 300, valid_citations_min: 1 }
      ci: { seconds_max: 300, valid_citations_min: 1 }
